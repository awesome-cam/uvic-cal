<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8" />

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    />

    <title>UVic Course Tools</title>

    <link
        rel="stylesheet"
        href="css/styles.css"
    />

</head>

<body>

<header>

    <h1>UVic Course Tools</h1>

    <nav class="tabs">

        <button
            class="tab-button active"
            data-tab="course-search"
        >
            Course Search
        </button>

        <button
            class="tab-button"
            data-tab="schedule-builder"
        >
            Schedule Builder
        </button>

    </nav>

</header>

<div class="container">

    <!-- COURSE SEARCH -->

    <div
        id="course-search-tab"
        class="tab-content active"
    >

        <div class="controls">

            <input
                type="text"
                id="courseInput"
                placeholder="Examples: BIOL186 or CHEM102"
            />

            <button id="searchButton">
                Search
            </button>

        </div>

        <div id="status"></div>

        <h2 id="currentCourse"></h2>

        <div id="results"></div>

    </div>

    <!-- SCHEDULE BUILDER -->

    <div
        id="schedule-builder-tab"
        class="tab-content"
    >

        <h2>Schedule Builder</h2>

        <div id="scheduleBuilderRoot"></div>

    </div>

</div>

<script src="js/tabs.js"></script>

<script src="js/course-data.js"></script>
<script src="js/course-search.js"></script>

<script src="js/schedule-builder.js"></script>

</body>
</html>
